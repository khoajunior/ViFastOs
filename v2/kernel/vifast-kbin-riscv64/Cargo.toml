# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vifast-kbin-riscv64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ảnh boot riscv64 K3 (KT-44): ảnh sản phẩm + ảnh ktest từ cùng crate, nạp qua OpenSBI"

# D2-08: ảnh test KHÔNG nằm trong ảnh sản phẩm. Tách ảnh bằng **feature** (không dùng cfg theo
# kiến trúc): bật `ktest` mới build bin `vifast-kbin-ktest`.
[features]
default = []
# D2-08: ảnh test tách bằng feature; đồng thời bật probe guard test-only ở crate arch.
ktest = ["vifast-plat-riscv64/ktest"]
# KT-72: ảnh virtio-blk (PCI ECAM + driver). Bật cùng `ktest`, chỉ cho bin `ktest-vblk`.
vblk = ["vifast-plat-riscv64/vblk"]
# KT-53: ảnh test U-mode (kèm ktest) — tách để ảnh chính/guard không link module U-mode.
user = ["vifast-plat-riscv64/user"]
# KT-73: ảnh `ktest-con` — UART RX IRQ → ring → U-mode + virtio-console hai queue. Ảnh sản phẩm
# và các ảnh cũ **không** bật (giữ nguyên `.text`/mapping; xem `docs/k6-console.md` §6).
con = ["ktest", "user", "vifast-plat-riscv64/vcon"]
# KT-74: ảnh `ktest-exec` — `Tcb.SetTls` (core) + `exec(path)` (plat). Tách ảnh riêng để `.text`
# của 6 ảnh cũ **không đổi** (D2-109/D2-111: tách khi chạm trần hoặc khi thêm đường mới).
exec = ["ktest", "user", "vifast-plat-riscv64/exec"]

[[bin]]
name = "vifast-kbin-riscv64"
path = "src/main.rs"

[[bin]]
name = "vifast-kbin-ktest"
path = "src/ktest.rs"
required-features = ["ktest"]

# KT-46: boot riêng cho guard page fault **thật** (scause 13/15) — mỗi boot chỉ kết thúc được một
# lần bằng PANIC có chủ đích (ảnh `ktest` đã dùng cho trap lồng KT-45). Vẫn là ảnh **test**: đòi
# feature `ktest`, không nằm trong ảnh sản phẩm (D2-08), chịu cùng trần budget (D2-72 Q5).
[[bin]]
name = "vifast-kbin-ktest-guard"
path = "src/ktest_guard.rs"
required-features = ["ktest"]

# KT-53: ảnh test **U-mode** riêng — nạp `init` ELF + 16 syscall qua `Machine` + fault cách ly.
[[bin]]
name = "vifast-kbin-ktest-user"
path = "src/ktest_user.rs"
required-features = ["ktest", "user"]

# KT-66: ảnh **demo** thứ tư, tách khỏi `vifast-kbin-ktest-user` (D2-87 §8.6): procsrv/shell/con
# U-mode (TAP 1..7) + fault/wx (8..10, boot kết thúc bằng `PANIC: u-mode fault` có chủ đích).
# Vẫn là ảnh test (feature `ktest,user`), không nằm trong ảnh sản phẩm (D2-08), cùng trần budget.
[[bin]]
name = "vifast-kbin-ktest-proc"
path = "src/ktest_proc.rs"
required-features = ["ktest", "user"]

# KT-72: ảnh **virtio-blk** riêng — cần `-drive`/`-device virtio-blk-pci`, nên tách khỏi 12 boot
# matrix cũ (D2-109: ảnh `ktest` 92,6 % trần; task cho phép tách ảnh khi chạm trần).
[[bin]]
name = "vifast-kbin-ktest-vblk"
path = "src/ktest_vblk.rs"
required-features = ["ktest", "vblk"]

# KT-73: ảnh **console** riêng — UART RX IRQ → ring → U-mode + virtio-console (`-device
# virtio-serial-pci` + `-chardev pipe`). Tách khỏi 15 boot matrix cũ để `.text`/mapping của chúng
# không đổi (D2-109: ảnh `ktest` 92,6 % trần; task cho phép tách ảnh).
[[bin]]
name = "vifast-kbin-ktest-con"
path = "src/ktest_con.rs"
required-features = ["ktest", "user", "con"]

# KT-74: ảnh **exec + TLS** riêng — `Tcb.SetTls` (method 15) + `exec(path)` 3 bước A→B→C, đo
# `objects/frames/caps` trước/sau để chứng minh không rò. Tách khỏi `ktest-user`/`ktest-proc` để
# TAP/`.text` của chúng không đổi (D2-109: mỗi ảnh một ngân sách, không nới trần).
[[bin]]
name = "vifast-kbin-ktest-exec"
path = "src/ktest_exec.rs"
required-features = ["ktest", "user", "exec"]

[dependencies]
vifast-plat-common = { path = "../vifast-plat-common" }
vifast-plat-riscv64 = { path = "../vifast-plat-riscv64" }
# KT-61: core `no_std` — TAP `ktest_core` và smoke ảnh sản phẩm gọi thẳng API core (D2-83).
vifast-core = { path = "../vifast-core" }
# KT-55: IR conformance (đọc 5 `.scn` bằng `include_str!`) + dòng trace chuẩn hoá dùng chung
# với sim. Cả hai `no_std`, không cấp phát, không dependency ngoài (D2-21).
vifast-scenario = { path = "../../lib/vifast-scenario" }
# KT-71: FS (journal/tx/fsck) + VFS tầng 2 (page cache write-back) — cả hai `no_std`,
# `#![forbid(unsafe_code)]`; cùng mã chạy trong test host.
vifast-fs = { path = "../../lib/vifast-fs" }
vifast-traceformat = { path = "../../lib/vifast-traceformat", default-features = false }
# KT-69: IDL stub sinh từ `.vidl` (method id/label/encode-decode) + ring 1P/1C trên Frame chia sẻ.
# Cả hai `no_std`, không phụ thuộc crate ngoài (D2-21).
vifast-idl = { path = "../../lib/vifast-idl" }
vifast-ring = { path = "../../lib/vifast-ring" }
# KT-70: pager + page cache tầng 1 (dùng lại `vifast-fs::BlockDev`); bảng mã lỗi cho evidence.
vifast-vfs = { path = "../../lib/vifast-vfs" }
vifast-abi = { path = "../../lib/vifast-abi" }
# KT-72: hằng số/mã lỗi virtio dùng trong ảnh test vblk (logic đã test host ở crate này).
vifast-virtio = { path = "../../lib/vifast-virtio" }
