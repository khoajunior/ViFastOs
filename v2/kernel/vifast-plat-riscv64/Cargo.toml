# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vifast-plat-riscv64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform QEMU virt riscv64 K3: entry, UART, SBI + cài Platform (có unsafe, D2-17)"

[features]
default = []
# Chỉ ảnh test (`vifast-kbin-ktest*`, feature `ktest`) bật: probe guard load resume-một-lần.
# Ảnh sản phẩm **không** có probe/chuỗi test; chính sách guard fault của nó luôn fatal.
ktest = []
# KT-53: chỉ ảnh `vifast-kbin-ktest-user` bật (user ⇒ ktest): nạp `init` ELF, U-mode, 3 syscall.
# Ảnh test chính/guard và ảnh sản phẩm **không** link module U-mode (giữ nguyên 37+3 TAP cũ).
user = ["ktest"]

[dependencies]
vifast-plat-common = { path = "../vifast-plat-common" }
# KT-53: parse/validate ELF64 user (`PT_LOAD`, W^X) — crate nội bộ `no_std`,
# `forbid(unsafe_code)`, không dependency ngoài (D2-21); loader/map vẫn ở crate arch.
vifast-elf = { path = "../../lib/vifast-elf" }
# KT-61: core `no_std` (CNode/MDB/cap/TCB/scheduler/IPC) link vào ảnh kernel thật.
# Crate nội bộ, `forbid(unsafe_code)`, không `alloc` (D2-21). D2-83: core **không** sở hữu
# Frame/PageTable/VSpace — phần đó vẫn ở `vifast-plat-common::obj` (KT-52).
vifast-core = { path = "../vifast-core" }
