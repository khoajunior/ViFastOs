# KT-80 / OD-K6-5 luật 3 (D2-108B) — registry bộ đếm.
#
# Quy ước:
#   * Mọi dòng evidence trong tài liệu đích khai `counter=<tên>` phải có mục ở đây.
#   * `proven = true`  ⇒ bắt buộc có **log ca âm trong repo** khớp `negative_pattern`
#                        (bộ đếm **khác 0**); thiếu/không khớp ⇒ luật 3 ĐỎ (E3_NEGATIVE_ZERO /
#                        E3_NO_NEGATIVE_LOG). Có thể khai thêm `positive_log` (đường xanh).
#   * `proven = false` ⇒ dòng `counter=<tên>` **không** được nằm trong khối `scope=` (khối được
#                        coi là ok): chỉ được nằm trong `scope-pending=`. Bắt buộc có `reason`.
#   * Mục khai mà không tài liệu nào dùng: chỉ cảnh báo (`# note`), không làm đỏ — để registry
#     giữ được bộ đếm của chiến dịch đo đang mở.
#
# Ngày ghi: 2026-11-17 (KT-80).

