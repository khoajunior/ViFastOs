send = 'time\n'
expect = 'so tick/thoi gian tu luc boot (v1: uptime -> <n> ticks)'
timeout_ms = 2000
source = 'docs/v1/agent2-report-21.md:81'
v1_output = ''
status = 'deferred-K7'
reason = 'shell v2 chua co lenh time (shell_user.rs:247-269 chi co help/echo/ps/wait/kill/exit); can syscall dong ho tren shell => K7'

